<!DOCTYPE html>
<html>
<head>
    <title>My GitHub Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 50px;

            background: linear-gradient(to right, #74ebd5, #ACB6E5);
        }

        .box {
            background-color: white;
            padding: 40px;
            max-width: 600px;
            margin: auto;
            border-radius: 15px;
            box-shadow: 0 5px 15px gray;
        }

        h1 {
            color: #4b4b9b;
        }

        h2 {
            color: #555;
        }

        p {
            font-size: 18px;
            color: #444;
        }

        button {
            background-color: #4b4b9b;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 20px;
            font-size: 16px;
        }

        button:hover {
            background-color: #333366;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>🌸🌼 Welcome to My Website 🌼🌸</h1>

        <p>
            Hello! This is my first website hosted using GitHub Pages.
        </p>

        <h2>My GitHub Project</h2>

        <p>
            I created this website to learn about
            repositories, branches and merging.
        </p>

        <button>My Project</button>

    </div>

</body>
</html>
